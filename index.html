<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>America Satire Desk — Mock</title>
<style>
  /* ============================================================
     America Satire Desk — soft cream edition (mock v0.2)
     Single-file / no external requests / offline OK
     機能は v0.1 と同一。デザインのみ刷新。
     ============================================================ */
  :root{
    /* palette: cream / beige / soft gray / dusty navy / calm orange-red */
    --bg:        #F6F1E7;   /* warm cream */
    --surface:   #FFFDF8;   /* card */
    --surface-2: #F3EDE0;   /* inner panel */
    --line:      #E7DECC;   /* soft divider */
    --text:      #453F36;   /* warm charcoal */
    --muted:     #9C9077;   /* soft khaki gray */
    --navy:      #5F7291;   /* dusty navy (labels / links) */
    --amber:     #E2A44E;   /* soft amber (marker) */
    --coral:     #CD6B57;   /* calm orange-red (stamp / primary) */
    --green:     #7FA383;   /* sage (saved) */
    --shadow:    0 6px 20px rgba(122, 100, 62, .10);
    --shadow-sm: 0 2px 8px  rgba(122, 100, 62, .08);
    --round: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN",
             ui-rounded, "SF Pro Rounded",
             "Yu Gothic", "游ゴシック", "Meiryo", sans-serif;
    --serif: Georgia, "Times New Roman", "Hiragino Mincho ProN", serif;
    --mono:  "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--round);
    font-size:15px;
    line-height:1.75;
    padding-bottom:96px; /* room for bottom tab bar */
  }
  ::selection{ background:var(--amber); color:#fff; }

  /* ---------- masthead ---------- */
  header.masthead{
    position:sticky; top:0; z-index:20;
    background:rgba(246,241,231,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:16px 18px 12px;
  }
  .masthead-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  h1.brand{
    font-family:var(--round);
    font-size:19px; font-weight:800; letter-spacing:.04em;
    color:var(--navy);
  }
  h1.brand .desk{
    color:var(--coral);
    position:relative; padding:0 2px;
  }
  h1.brand .desk::after{
    content:""; position:absolute; left:0; right:0; bottom:2px;
    height:6px; background:var(--amber); opacity:.35; border-radius:3px;
    z-index:-1;
  }
  .edition{
    font-family:var(--mono); font-size:10.5px; color:var(--muted);
    text-align:right; line-height:1.5; letter-spacing:.06em;
  }
  .edition b{ color:var(--navy); font-weight:600; }

  /* ---------- bottom tab bar ---------- */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; gap:6px;
    background:rgba(255,253,248,.95);
    backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(122,100,62,.06);
  }
  nav.tabs button{
    flex:1; padding:11px 4px;
    background:none; border:none; border-radius:14px;
    color:var(--muted);
    font-family:var(--round); font-size:12px; font-weight:700; letter-spacing:.05em;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  nav.tabs button .n{
    display:inline-block; min-width:19px; margin-left:5px;
    font-family:var(--mono); font-size:10.5px;
    background:var(--surface-2); border-radius:10px; padding:1px 6px;
  }
  nav.tabs button.active{ color:#fff; background:var(--navy); }
  nav.tabs button.active .n{ background:rgba(255,255,255,.25); color:#fff; }

  main{ max-width:640px; margin:0 auto; padding:20px 16px 32px; }
  .view{ display:none; }
  .view.active{ display:block; }
  .lede{ color:var(--muted); font-size:13px; margin-bottom:18px; }

  /* ---------- candidate card ---------- */
  article.card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
    margin-bottom:26px;
    overflow:hidden;
  }
  /* galley spine: candidate number down the left edge */
  .spine{
    position:absolute; top:0; bottom:0; left:0; width:40px;
    border-right:1px dashed var(--line);
    background:linear-gradient(to bottom, #FBF7EE, #F7F1E4);
    display:flex; flex-direction:column; align-items:center;
    padding-top:14px; gap:12px;
  }
  .spine .no{
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--amber); color:#fff;
    font-family:var(--round); font-size:13px; font-weight:800;
    box-shadow:var(--shadow-sm);
  }
  .spine .vlabel{
    writing-mode:vertical-rl;
    font-family:var(--mono); font-size:8.5px; letter-spacing:.35em;
    color:var(--muted); text-transform:uppercase; opacity:.8;
  }
  .card-body{ padding:18px 16px 18px 54px; }

  /* rubber stamp — softened */
  .stamp{
    position:absolute; top:12px; right:12px;
    transform:rotate(4deg);
    font-family:var(--mono); font-size:9.5px; letter-spacing:.22em;
    color:var(--coral); border:1.5px dashed var(--coral);
    border-radius:999px; padding:3px 11px;
    background:rgba(205,107,87,.06);
    pointer-events:none;
  }
  .stamp.saved{
    color:var(--green); border-color:var(--green);
    background:rgba(127,163,131,.08); transform:rotate(-3deg);
  }

  /* section slug headers */
  .slug{
    display:flex; align-items:center; gap:8px;
    font-family:var(--round); font-size:11px; font-weight:800;
    letter-spacing:.16em; color:var(--navy); text-transform:uppercase;
    margin:20px 0 9px;
  }
  .slug::after{ content:""; flex:1; height:1px; background:var(--line); opacity:.7; }
  .slug .dot{ width:8px; height:8px; border-radius:50%; background:var(--amber); }
  .slug.commentary .dot{ background:var(--coral); }
  .slug.image .dot{ background:var(--navy); }
  .slug.caption .dot{ background:var(--green); }
  .slug:first-child{ margin-top:2px; }

  /* ---------- NEWS / EVENT pastel panels (per candidate) ---------- */
  .news-panel{
    border-radius:16px;
    border:1px solid transparent;
    padding:13px 14px 14px;
    margin:2px 0 6px;
  }
  .news-panel .slug{ margin-top:0; }
  .news-panel .slug::after{ opacity:.45; }
  .news-panel .summary, .news-panel h2.headline{ color:#443F35; }
  .news-panel .meta{ color:#8B8271; }
  /* 1: 薄い黄色 */
  .news-panel.tone-1{ background:#FBF3D3; border-color:#EFE0A9; }
  .news-panel.tone-1 .slug .dot{ background:#D9A824; }
  /* 2: 薄い水色 */
  .news-panel.tone-2{ background:#E1EFF6; border-color:#C6DEEA; }
  .news-panel.tone-2 .slug .dot{ background:#5F93B5; }
  /* 3: 薄いオレンジ */
  .news-panel.tone-3{ background:#FBE7D5; border-color:#F0D1B3; }
  .news-panel.tone-3 .slug .dot{ background:#D9863F; }
  /* 4: 薄い緑 */
  .news-panel.tone-4{ background:#E3F0DF; border-color:#C9E0C3; }
  .news-panel.tone-4 .slug .dot{ background:#6FA063; }
  /* 5: 薄い紫 */
  .news-panel.tone-5{ background:#EBE5F5; border-color:#D6CCE9; }
  .news-panel.tone-5 .slug .dot{ background:#8C79B8; }

  h2.headline{
    font-family:var(--round); font-size:18px; line-height:1.5;
    font-weight:800; color:#3B3F4E;
    margin-bottom:9px; padding-right:60px;
  }
  .meta{
    display:flex; flex-wrap:wrap; gap:6px 14px;
    font-family:var(--mono); font-size:11px; color:var(--muted);
    margin-bottom:9px;
  }
  .meta a{ color:var(--navy); text-decoration:none; word-break:break-all; }
  .meta a:active{ text-decoration:underline; }
  .summary{ font-size:14px; }

  ul.points{ list-style:none; }
  ul.points li{
    position:relative; padding-left:22px; margin-bottom:13px; font-size:14px;
  }
  ul.points li::before{
    content:"❋"; position:absolute; left:0; top:3px;
    color:var(--coral); font-size:12px;
  }
  /* 小見出し（矛盾 / 滑稽さ / 日本・海外から見ると）: 本文より一回り大きく */
  ul.points li b{
    display:block;
    font-family:var(--round);
    font-size:15.5px; font-weight:800;
    color:var(--navy);
    letter-spacing:.02em;
    line-height:1.5;
    margin-bottom:2px;
  }

  .figure-wrap{
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    background:var(--surface-2); box-shadow:var(--shadow-sm);
  }
  .figure-wrap svg{ display:block; width:100%; height:auto; }
  .figure-wrap img.real-img{ display:block; width:100%; height:auto; }
  .prompt-box{
    border-top:1px dashed var(--line);
    padding:11px 13px;
    font-family:var(--mono); font-size:11.5px; line-height:1.7;
    color:var(--muted); word-break:break-word;
    background:#FBF7EE;
  }
  .prompt-box .k{ color:var(--navy); font-weight:600; }

  .caption-box{
    background:var(--surface-2);
    border-left:4px solid var(--amber);
    border-radius:6px 14px 14px 6px;
    padding:12px 14px; margin-bottom:9px;
  }
  .caption-box.alt{ border-left-color:var(--line); }
  .caption-box .lbl{
    font-family:var(--round); font-size:9.5px; font-weight:800;
    letter-spacing:.18em; color:var(--muted); text-transform:uppercase;
    display:block; margin-bottom:3px;
  }
  .caption-box .txt{ font-family:var(--serif); font-size:14.5px; font-style:italic; color:#4C463C; }
  .caption-box .txt-ja{
    font-family:var(--round); font-size:12.5px; font-style:normal;
    color:#8B8271; line-height:1.7; margin-top:3px;
  }

  /* ---------- buttons ---------- */
  .btn-row{ display:flex; flex-wrap:wrap; gap:9px; margin-top:18px; }
  button.btn{
    font-family:var(--round); font-size:12.5px; font-weight:700;
    padding:10px 15px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line);
    background:#FBF8F1; color:var(--navy);
    box-shadow:var(--shadow-sm);
    transition:transform .08s ease, background .15s ease;
  }
  button.btn:active{ transform:scale(.95); background:var(--surface-2); }
  button.btn.primary{
    background:var(--coral); border-color:var(--coral); color:#fff;
    box-shadow:0 4px 14px rgba(205,107,87,.30);
  }
  button.btn.saved-state{
    background:var(--green); border-color:var(--green); color:#fff;
    box-shadow:0 4px 14px rgba(127,163,131,.30);
  }
  button.btn:focus-visible, nav.tabs button:focus-visible{
    outline:2px solid var(--navy); outline-offset:2px;
  }

  /* ---------- today's article ---------- */
  .article-actions{
    display:flex; flex-direction:column; gap:10px;
    margin:4px 0 22px;
  }
  .article-actions .btn{ width:100%; padding:14px 15px; font-size:14px; }
  section.comp pre.article-pre{
    font-size:13.5px; line-height:1.85;
    max-height:70vh; overflow:auto;
    -webkit-overflow-scrolling:touch;
  }
  .article-note{
    font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.7;
  }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#FFFDF8;
    font-family:var(--round); font-size:13px; font-weight:700;
    padding:10px 18px; border-radius:999px;
    box-shadow:var(--shadow);
    opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:50; max-width:88vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
  /* ---------- editor's room ---------- */
  .ed-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px; box-shadow:var(--shadow-sm);
  }
  .ed-card h3{
    font-family:var(--round); font-size:15px; font-weight:800; color:var(--navy);
    margin-bottom:8px;
  }
  .ed-thread{
    background:var(--surface-2); border-left:4px solid var(--amber);
    border-radius:10px; padding:10px 12px; font-size:13.5px; margin-bottom:16px;
  }
  .ed-thread b{ color:var(--navy); }
  .ed-pre{
    white-space:pre-wrap; word-break:break-word;
    font-family:var(--round); font-size:13.5px; line-height:1.8;
    background:#FBF8F1; border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin:10px 0;
    max-height:340px; overflow-y:auto;
  }
  .ed-item{
    display:flex; align-items:flex-start; gap:8px;
    background:#FBF8F1; border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:8px; font-size:13.5px;
  }
  .ed-item .t{ flex:1; }
  .ed-item .cnt{
    font-family:var(--mono); font-size:10.5px; color:var(--muted); white-space:nowrap;
  }
  .ed-item .cnt.over{ color:var(--coral); font-weight:700; }
  .ed-checklist{
    background:var(--surface-2); border-radius:12px; padding:12px 14px;
    font-size:13px; margin-bottom:16px;
  }
  .ed-checklist b{ color:var(--coral); }
  .ed-checklist ul{ margin:6px 0 0 18px; }
</style>
</head>

"use strict";
/* ================================================================
   America Satire Desk — mock v0.2 (soft cream edition)
   - モックデータのみ（外部API・自動投稿は一切なし）
   - localStorage 保存（使えない環境ではメモリにフォールバック）
   ================================================================ */

/* ---------- safe storage (localStorage or in-memory fallback) ---------- */
const storage = (() => {
  const mem = {};
  let ok = false;
  try {
    const k = "__asd_test__";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    ok = true;
  } catch (e) { ok = false; }
  return {
    persistent: ok,
    get(key){
      try { return ok ? localStorage.getItem(key) : (key in mem ? mem[key] : null); }
      catch(e){ return mem[key] ?? null; }
    },
    set(key, val){
      try { if (ok) localStorage.setItem(key, val); else mem[key] = val; }
      catch(e){ mem[key] = val; }
    },
    remove(key){
      try { if (ok) localStorage.removeItem(key); else delete mem[key]; }
      catch(e){ delete mem[key]; }
    }
  };
})();

/* ---------- app state ---------- */
const state = {
  // per-candidate rotating indices for regenerate buttons
  vary: {}           // id -> { img: 0, cap: 0 }
};

/* ================================================================
   daily data loading
   - 毎朝バックエンドが自動生成する daily.json を読み込む想定。
   - index.html は「daily.json を読み込んで表示するフロントエンド」。
   - 読み込み優先順位:
       1) 同フォルダの daily.json（fetch）
       2) 同フォルダの daily.js（window.DAILY_DATA / file://直開き用）
       3) 内蔵モックデータ（フォールバック。アプリは壊れない）
   ================================================================ */
let CANDIDATES = [];                     // 実行時の5候補（全機能はこれを参照）
let EDITORIAL = null;                    // 編集室データ（daily.json の editorial。無ければ null）
let CAROUSEL = [];                       // TikTok/Instagram用カルーセル画像の相対パス
let dataSource = "モックデータ";

/* commentary はHTMLとして描画されるため、<b>タグ以外はエスケープする */
function sanitizeCommentaryHtml(s){
  return esc(String(s)).replace(/&lt;(\/?)b&gt;/g, "<$1b>");
}

/* daily.json の候補を内部構造に正規化。欠けたフィールドは安全な既定値で補完 */
function normalizeCandidates(raw){
  const arr = Array.isArray(raw) ? raw
            : (raw && Array.isArray(raw.candidates)) ? raw.candidates
            : null;
  if (!arr || !arr.length) throw new Error("no candidates in data");
  return arr.slice(0, 5).map((c, idx) => {
    const news = c.news || {};
    const captions = (Array.isArray(c.captions) && c.captions.length
      ? c.captions : ["(caption missing)"]).map(String);
    const captionsJa = (Array.isArray(c.captionsJa) && c.captionsJa.length
      ? c.captionsJa : ["（日本語訳未設定）"]).map(String);
    const imagePrompts = (Array.isArray(c.imagePrompts) && c.imagePrompts.length
      ? c.imagePrompts : ["Editorial cartoon, cross-hatching style, placeholder scene."]).map(String);
    const commentary = (Array.isArray(c.commentary) ? c.commentary : [])
      .map(sanitizeCommentaryHtml);
    const ironyEn = (Array.isArray(c.ironyEn) && c.ironyEn.length ? c.ironyEn : [{
      contradiction: "The event contradicts the stated principle of the institution involved.",
      absurdity: "The situation functions as its own parody; no exaggeration was required.",
      outside: "Seen from outside the U.S., the story reads like a documented sketch premise."
    }]).map(v => ({
      contradiction: String(v.contradiction || ""),
      absurdity: String(v.absurdity || ""),
      outside: String(v.outside || "")
    }));
    return {
      id: String(c.id || ("d" + (idx + 1))),
      news: {
        headline: String(news.headline || "(headline missing)"),
        source:   String(news.source || "unknown source"),
        date:     String(news.date || new Date().toISOString().slice(0, 10)),
        url:      String(news.url || ""),
        summary:  String(news.summary || "")
      },
      commentary,
      imagePrompts,
      captions,
      captionsJa,
      newsEn: String(c.newsEn || (news.headline ? news.headline + "." : "")),
      ironyEn,
      image: (typeof c.image === "string" && c.image.trim()) ? c.image.trim() : null,
      imagePunchy: (typeof c.imagePunchy === "string" && c.imagePunchy.trim()) ? c.imagePunchy.trim() : null,
      imageSeed: Number.isFinite(c.imageSeed) ? c.imageSeed : idx + 1
    };
  });
}

function applyCandidates(list, sourceLabel){
  CANDIDATES = list;
  state.vary = {};
  CANDIDATES.forEach(c => state.vary[c.id] = { img: 0, cap: 0 });
  dataSource = sourceLabel;
}

/* editorial（編集室データ）の正規化。壊れていたら null（=編集室は案内表示のみ） */
function normalizeEditorial(raw){
  if (!raw || typeof raw !== "object") return null;
  try {
    const norm = {
      thread:  String(raw.thread || ""),
      titleEn: String(raw.titleEn || ""),
      subtitleEn: String(raw.subtitleEn || ""),
      titleJa: String(raw.titleJa || ""),
      titleAltJa: (Array.isArray(raw.titleAltJa) ? raw.titleAltJa : []).map(String).filter(Boolean),
      leadJa: String(raw.leadJa || ""),
      quipEn: String(raw.quipEn || ""),
      quipJa: String(raw.quipJa || ""),
      fortuneEn: String(raw.fortuneEn || ""),
      fortuneJa: String(raw.fortuneJa || ""),
      monologueEn: raw.monologueEn || null,
      monologueJa: raw.monologueJa || null,
      reviewNotes: String(raw.reviewNotes || ""),
      fullEn:  String(raw.fullEn || ""),
      fullJa:  String(raw.fullJa || ""),
      notesEn: (Array.isArray(raw.notesEn) ? raw.notesEn : []).map(String).filter(Boolean),
      xJa:     (Array.isArray(raw.xJa) ? raw.xJa : []).map(String).filter(Boolean)
    };
    if (!norm.fullEn && !norm.fullJa && !norm.notesEn.length && !norm.xJa.length) return null;
    return norm;
  } catch(e){ return null; }
}

async function loadDailyData(){
  // 1) daily.json（http/https で開いている場合の本命経路）
  try {
    const res = await fetch("daily.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    applyCandidates(normalizeCandidates(json), "daily.json");
    EDITORIAL = normalizeEditorial(json.editorial);
    CAROUSEL = Array.isArray(json.carousel) ? json.carousel.map(String) : [];
    return;
  } catch(e){ /* 次の経路へ */ }
  // 2) daily.js → window.DAILY_DATA（file:// で直接開いた場合の代替経路）
  try {
    if (window.DAILY_DATA){
      applyCandidates(normalizeCandidates(window.DAILY_DATA), "daily.js");
      EDITORIAL = normalizeEditorial(window.DAILY_DATA.editorial);
      CAROUSEL = Array.isArray(window.DAILY_DATA.carousel) ? window.DAILY_DATA.carousel.map(String) : [];
      return;
    }
  } catch(e){ /* 次の経路へ */ }
  // 3) 内蔵モックデータ（フォールバック）
  applyCandidates(normalizeCandidates(MOCK_CANDIDATES), "内蔵モックデータ");
  EDITORIAL = null;
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------- view switching ---------- */
function switchView(name){
  ["today","editorial"].forEach(n => {
    document.getElementById("view-" + n).classList.toggle("active", n===name);
    document.getElementById("tab-" + n).classList.toggle("active", n===name);
  });
  window.scrollTo({ top:0 });
}

/* ---------- render: today's cards ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

/* 画像パスの拡張子（.jpg / .png）。不明なら .png */
function imgExt(path){
  const m = String(path || "").match(/\.[a-z0-9]+$/i);
  return m ? m[0].toLowerCase() : ".png";
}

/* カードの図版: バリエーション0でAI生成画像があれば実画像、
   なければ（または読み込み失敗時は）SVGプレースホルダー */
function candidateFigureHtml(c, v){
  const variant = v.img % c.imagePrompts.length;
  if (c.image && variant === 0){
    return `<img class="real-img" src="${esc(c.image)}" alt="satirical illustration"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <div class="fig" style="display:none">${placeholderSVG(c.imageSeed, 0, esc(c.id.toUpperCase()))}</div>`;
  }
  return `<div class="fig">${placeholderSVG(c.imageSeed, variant, esc(c.id.toUpperCase()))}</div>`;
}

function renderCards(){
  const wrap = document.getElementById("cards");
  wrap.innerHTML = "";
  CANDIDATES.forEach((c, idx) => {
    const v = state.vary[c.id];
    const el = document.createElement("article");
    el.className = "card";
    el.id = "card-" + c.id;
    el.innerHTML = `
      <div class="spine">
        <div class="no">${idx+1}</div>
        <div class="vlabel">CANDIDATE</div>

/* ---------- publish pack: 整形済み記事の組み立てとリッチコピー ---------- */

/* 相対画像パスを公開URLに変換（file://直開き時はnullを返して画像を省略） */
function absImageUrl(path){
  if (!path) return null;
  if (location.protocol === "file:") return null;
  try { return new URL(path, location.href).href; } catch(e){ return null; }
}

/* beat順に並んだ候補配列を返す（モノローグの流れと同じ順） */
function beatsOrder(mono){
  const byId = {};
  CANDIDATES.forEach(c => byId[c.id] = c);
  if (!mono || !Array.isArray(mono.beats)) return CANDIDATES.slice();
  return mono.beats.map(b => byId[b.ref]).filter(Boolean);
}

/* 改行(\n)を段落として尊重する。話し言葉の息継ぎをそのまま再現 */
function pText(s){
  return String(s).split(/\n+/).map(t => t.trim()).filter(Boolean)
    .map(t => `<p>${esc(t)}</p>`).join("\n");
}
/* 記事用画像: Punchy合成版があればそれを優先 */
function articleArt(c){ return c ? (c.imagePunchy || c.image) : null; }
function imgTag(c, style){
  const url = absImageUrl(articleArt(c));
  if (!url) return "";
  return `<img src="${esc(url)}" alt="satirical illustration" style="max-width:100%">`;
}

/* Substack本文（英語）: 表紙→掴み→くだり（途中に画像2枚と引用1本）→締め→出典→開示 */
function buildSubstackHtml(){
  const ed = EDITORIAL, mono = ed.monologueEn;
  if (!mono) return null;
  const ordered = beatsOrder(mono);
  const withImg = ordered.filter(c => absImageUrl(articleArt(c)));
  const parts = [];
  if (withImg[0]) parts.push(imgTag(withImg[0]));                 // 表紙 = 最初のくだりの絵
  parts.push(pText(mono.opener));
  parts.push("<hr>");
  mono.beats.forEach((b, i) => {
    parts.push(pText(b.text));
    // 中盤と終盤の手前に画像を1枚ずつ差し込む（表紙と重複しない絵を選ぶ）
    if (i === 1 && withImg[1]) parts.push(imgTag(withImg[1]));
    if (i === 3 && withImg[2]) parts.push(imgTag(withImg[2]));
  });
  // 引用（プルクオート）: 最後のくだり=一番強いネタのキャプションを1本
  const last = ordered[ordered.length - 1];
  if (last && last.captions && last.captions[0]){
    parts.push(`<blockquote><p>${esc(last.captions[0])}</p></blockquote>`);
  }
  parts.push(pText(mono.closer));
  if (ed.fortuneEn){
    parts.push("<hr>");
    parts.push("<p><strong>Today's Forecast</strong> (news-based, scientifically dubious, warmly meant):</p>");
    parts.push(`<blockquote><p>${esc(ed.fortuneEn)}</p></blockquote>`);
  }
  if (ed.quipEn){
    parts.push("<hr>");
    parts.push("<p><strong>Steal this line</strong> — for your next meeting:</p>");
    parts.push(`<blockquote><p>${esc(ed.quipEn)}</p></blockquote>`);
  }
  parts.push("<hr>");
  parts.push("<p><strong>Today's Docket</strong> (in order of appearance)</p>");
  const docket = mono.beats.map(b => {
    const c = CANDIDATES.find(x => x.id === b.ref);
    if (!c) return "";
    return `<li><a href="${esc(c.news.url)}">${esc(c.news.headline)}</a> — ${esc(c.news.source)}</li>`;
  }).join("");
  parts.push(`<ol>${docket}</ol>`);
  parts.push(`<p><em>Made in Tokyo by one human and his AI newsroom. How this gets made is on the About page.</em></p>`);
  return parts.join("\n");
}

/* note本文（日本語）: リード→表紙→モノローグ（途中に画像と区切り）→今日の5本 */
function buildNoteHtml(){
  const ed = EDITORIAL, mono = ed.monologueJa;
  if (!mono) return null;
  const ordered = beatsOrder(mono);
  const withImg = ordered.filter(c => absImageUrl(articleArt(c)));
  const parts = [];
  const lead = ed.leadJa || (mono.opener || "").split("。")[0] + "。";
  parts.push(pText(lead));
  if (withImg[0]) parts.push(imgTag(withImg[0]));
  parts.push(pText(mono.opener));
  parts.push("<hr>");
  mono.beats.forEach((b, i) => {
    parts.push(pText(b.text));
    if (i === 1 && withImg[1]) parts.push(imgTag(withImg[1]));
    if (i === 3 && withImg[2]) parts.push(imgTag(withImg[2]));
  });
  parts.push(pText(mono.closer));
  if (ed.fortuneJa){
    parts.push("<hr>");
    parts.push("<p><strong>今日の運勢</strong>（ニュース連動・非科学的・でも本気で応援）</p>");
    parts.push(`<blockquote><p>${esc(ed.fortuneJa)}</p></blockquote>`);
  }
  if (ed.quipJa){
    parts.push("<hr>");
    parts.push("<p><strong>今日の使える一言</strong>（明日この話題が出たら、これをどうぞ）</p>");
    parts.push(`<blockquote><p>${esc(ed.quipJa)}</p></blockquote>`);
  }
  parts.push("<hr>");
  parts.push("<p><strong>今日の5本</strong>（登場順）</p>");
  const docket = mono.beats.map(b => {
    const c = CANDIDATES.find(x => x.id === b.ref);
    if (!c) return "";
    return `<li><a href="${esc(c.news.url)}">${esc(c.news.headline)}</a>（${esc(c.news.source)}）</li>`;
  }).join("");
  parts.push(`<ol>${docket}</ol>`);
  return parts.join("\n");
}

/* リッチテキスト（text/html）としてコピー。貼り付け先で見出し・画像・リンクが再現される */
async function copyRich(html, plainFallback, btn){
  const done = () => {
    toast("整形済みでコピーしました。エディタに貼り付けてください");
    if (btn){ const t = btn.textContent; btn.textContent = "✓ コピー済み"; setTimeout(()=>btn.textContent = t, 2000); }
  };
  try {
    const item = new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([plainFallback], { type: "text/plain" })
    });
    await navigator.clipboard.write([item]);
    done();
  } catch(e){
    fallbackCopy(plainFallback, done); // リッチ非対応環境はプレーンで
  }
}

function copyPack(kind, ev){
  if (!EDITORIAL) return;
  const btn = ev ? ev.currentTarget : null;
  if (kind === "sub-body"){
    const html = buildSubstackHtml();
    if (html) copyRich(html, EDITORIAL.fullEn, btn);
  } else if (kind === "note-body"){
    const html = buildNoteHtml();
    if (html) copyRich(html, EDITORIAL.fullJa, btn);
  } else if (kind === "sub-title"){
    copyEdText(EDITORIAL.titleEn, btn);
  } else if (kind === "sub-subtitle"){
    copyEdText(EDITORIAL.subtitleEn || EDITORIAL.thread, btn);
  } else if (kind === "note-title"){
    copyEdText(EDITORIAL.titleJa, btn);
  }
}

/* カルーセル7枚をZIPで一括ダウンロード */
async function downloadCarousel(ev){
  const btn = ev ? ev.currentTarget : null;
  if (!CAROUSEL.length) return;
  try {
    if (btn) btn.textContent = "⏳ 準備中…";
    const files = [];
    for (let i = 0; i < CAROUSEL.length; i++){
      const url = new URL(CAROUSEL[i], location.href).href;
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      files.push({ name: `carousel-${String(i + 1).padStart(2, "0")}.jpg`,
                   data: new Uint8Array(await res.arrayBuffer()) });
    }
    const zipBytes = buildZip(files);
    const blob = new Blob([zipBytes], { type: "application/zip" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `satire-carousel-${new Date().toISOString().slice(0,10)}.zip`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("カルーセルをZIPで保存しました");
  } catch(e){
    toast("保存に失敗しました: " + (e && e.message ? e.message : e));
  } finally {
    if (btn) btn.textContent = "📦 一括保存";
  }
}

function copyEdText(text, btn){
  if (!text) return;
  const done = () => {
    toast("コピーしました");
    if (btn){ const t = btn.textContent; btn.textContent = "✓"; setTimeout(()=>btn.textContent = t, 1500); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;

  document.body.removeChild(ta);
}

/* ---------- image downloads (SVG → PNG → ZIP) ----------
   外部ライブラリなし。SVGをCanvas経由でPNG化し、無圧縮(store方式)の
   最小ZIPをJSで自作して1ファイルにまとめてダウンロードする。
   （連続個別DLはChrome等でブロックされるためZIP一括に変更） */
async function svgStringToPngBlob(svgStr, scale = 2){
  const img = await svgToImage(svgStr.trim());
  const canvas = document.createElement("canvas");
  canvas.width = 640 * scale;
  canvas.height = 340 * scale;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve, reject) =>
    canvas.toBlob(b => b ? resolve(b) : reject(new Error("PNG encode failed")), "image/png"));
}

/* --- minimal ZIP writer (method 0 = stored / no compression) --- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function buildZip(files){ // files: [{ name: string, data: Uint8Array }]
  const enc = new TextEncoder();
  const u16 = v => new Uint8Array([v & 255, (v >>> 8) & 255]);
  const u32 = v => new Uint8Array([v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]);
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  const parts = [];      // 出力バイト列
  const central = [];    // セントラルディレクトリ
  let offset = 0;
  const push = (arr) => { for (const p of arr){ parts.push(p); offset += p.length; } };

  for (const f of files){
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const localOffset = offset;
    push([
      u32(0x04034b50), u16(20), u16(0), u16(0),          // local header / version / flags / method=store
      u16(dosTime), u16(dosDate),
      u32(crc), u32(f.data.length), u32(f.data.length),  // crc / compressed / uncompressed
      u16(name.length), u16(0),                           // name len / extra len
      name, f.data
    ]);
    central.push({ name, crc, size: f.data.length, localOffset });
  }

  const cdStart = offset;
  for (const c of central){
    push([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0),
      u16(dosTime), u16(dosDate),
      u32(c.crc), u32(c.size), u32(c.size),
      u16(c.name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(c.localOffset),
      c.name
    ]);
  }
  const cdSize = offset - cdStart;
  push([
    u32(0x06054b50), u16(0), u16(0),
    u16(central.length), u16(central.length),
    u32(cdSize), u32(cdStart), u16(0)
  ]);
  return new Blob(parts, { type: "application/zip" });
}

async function downloadImagesAsZip(items, zipName){ // items: [{ svg, url?, filename }]
  toast("ZIPを作成しています…");
  try {
    const files = [];
    for (const it of items){
      let blob = null;
      let name = it.filename;
      if (it.url){
        // AI生成の実画像を取得。失敗したらプレースホルダーPNGに切り替え
        try {
          const r = await fetch(it.url, { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          blob = await r.blob();
        } catch(e){
          blob = null;
        }
      }
      if (!blob){
        blob = await svgStringToPngBlob(it.svg);
        name = name.replace(/\.[a-z0-9]+$/i, ".png");
      }
      const buf = await blob.arrayBuffer();
      files.push({ name, data: new Uint8Array(buf) });
    }
    const zip = buildZip(files);
    const url = URL.createObjectURL(zip);
    const a = document.createElement("a");
    a.href = url;
    a.download = zipName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`${zipName}（${files.length}枚入り）をダウンロードしました`);
  } catch(e){
    toast("ZIPの作成に失敗しました: " + (e && e.message ? e.message : e));
  }
}

function downloadAllImages(){
  const items = CANDIDATES.map((c, idx) => {
    const v = state.vary[c.id];
    const variant = v.img % c.imagePrompts.length;
    const useReal = !!c.image && variant === 0;
    return {
      svg: placeholderSVG(c.imageSeed, variant, c.id.toUpperCase()),
      url: useReal ? c.image : null,
      filename: `punchline-republic-candidate-${idx + 1}` + (useReal ? imgExt(c.image) : ".png")
    };
  });
  downloadImagesAsZip(items, "punchline-republic-candidates.zip");
}

/* ---------- today's article (mock generator) ----------
   固定タイトル + 日替わり副題 + イントロ + 5候補ブロック + クロージング。
   Regenerate Article で副題 / イントロ / THE IRONY の表現 / クロージングが
   切り替わる。NEWS / EVENT の事実説明（newsEn）は常に固定。 */
const ARTICLE_SUBTITLES = [
  "Five headlines from a country increasingly committed to the bit.",
  "Today, America outsourced common sense to a committee.",
  "A morning briefing from the place where policy keeps writing its own punchlines.",
  "Five stories a satire writer would reject for being too on the nose.",
  "In today's episode, the system explains itself better than any joke could.",
  "America woke up, looked in the mirror, and doubled down."
];
const ARTICLE_INTROS = [
  "Every morning, American news performs a small miracle: it arrives pre-satirized. The five stories below required no exaggeration — the institutions involved did the comedy writing themselves. We just added the labels. Facts first, irony second, as always.",
  "Some countries make satire. America generates it as a byproduct, like heat from an engine. Here are today's five exhibits, each presented twice: once as it happened, and once as it lands. The gap between the two is the whole story.",
  "You could invent stories like these, but why bother? Today's five headlines were produced by committees, press offices, and ribbon-cutting ceremonies that never once suspected they were doing comedy. The facts are laid out below, clearly separated from our commentary — the punchlines, as usual, came pre-installed."
];
const ARTICLE_CLOSINGS = [
  "That's today's five. The republic will generate more overnight — it always does. See you tomorrow at the punchline.",
  "None of this needed a writers' room, which is either efficient or alarming. Sleep on it. Tomorrow's edition is already being drafted, in official buildings, by people who mean every word.",
  "We don't write the jokes; we just file them. Same desk, same time tomorrow — the material never calls in sick."
];

let artSeed = Math.floor(Math.random() * ARTICLE_SUBTITLES.length);
let articleGenerated = false;

function buildArticleText(){
  const subtitle = ARTICLE_SUBTITLES[artSeed % ARTICLE_SUBTITLES.length];
  const intro    = ARTICLE_INTROS[artSeed % ARTICLE_INTROS.length];
  const closing  = ARTICLE_CLOSINGS[artSeed % ARTICLE_CLOSINGS.length];

  const blocks = CANDIDATES.map((c, idx) => {
    const v = state.vary[c.id];
    const caption = c.captions[v.cap % c.captions.length];        // 現在選択中のCaption（英文のみ）
    const prompt  = c.imagePrompts[v.img % c.imagePrompts.length]; // 現在選択中のimage prompt
    const irony   = c.ironyEn[artSeed % c.ironyEn.length];         // 表現バリエーション
    const fileExt = (!!c.image && (v.img % c.imagePrompts.length) === 0) ? imgExt(c.image) : ".png";
    return `## ${caption}

NEWS / EVENT:
${c.newsEn}

THE IRONY:
- Contradiction: ${irony.contradiction}
- Absurdity: ${irony.absurdity}
- Outside View: ${irony.outside}

Suggested image:
Use Candidate ${idx + 1} satirical image. (file: punchline-republic-candidate-${idx + 1}${fileExt})
Image prompt: ${prompt}`;
  }).join("\n\n---\n\n");

  return `# The Punchline Republic

## ${subtitle}

${intro}

---

${blocks}

---

${closing}`;
}

function renderArticle(){
  const text = buildArticleText();
  document.getElementById("articleOut").innerHTML = `
    <section class="comp">
      <h3>📝 Today’s Article <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">Substack draft · Markdown</span></h3>
      <pre class="article-pre" id="articleText">${esc(text)}</pre>
      <div class="btn-row">
        <button class="btn primary" onclick="copyComp('articleText')">📋 Copy Full Article</button>
        <button class="btn" onclick="downloadAllImages()">🖼 Download All 5 Images</button>
        <button class="btn" onclick="regenArticle()">🔁 Regenerate Article</button>
      </div>
      <p class="article-note">※ NEWS / EVENT の事実パートは固定です。Regenerate Article では副題・イントロ・THE IRONY の表現・クロージングが切り替わります。各カードで Caption や画像を変更してから生成すると、見出しと Image prompt にも反映されます。<br>作業の流れ: ① Copy Full Article → ② Download All 5 Images → ③ Substackに本文を貼る → ④ 5枚の画像を手動アップロード。</p>
    </section>`;
}

function generateArticle(){
  articleGenerated = true;
  renderArticle();
  toast("今日の記事を生成しました（モック）");
  document.getElementById("articleOut").scrollIntoView({ behavior:"smooth", block:"start" });
}

function regenArticle(){
  artSeed++;
  renderArticle();
  toast("記事を再生成しました（副題・イントロ・IRONY・結びを変更）");
}

function svgToImage(svgStr){
  return new Promise((resolve, reject) => {
    // canvasへの描画にはintrinsic sizeが必要なので width/height を付与
    const sized = svgStr.replace("<svg ", '<svg width="640" height="340" ');
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("svg rasterize failed"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(sized);
  });
}
