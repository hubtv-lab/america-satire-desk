name: Rebuild videos only

on:
  workflow_dispatch: {}   # Actionsタブから手動実行専用(記事は触らず動画だけ作り直す)

permissions:
  contents: write

concurrency:
  group: daily-generate
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install pillow edge-tts

      - name: Rebuild EN video
        run: python scripts/make_video.py

      - name: Rebuild JA video
        continue-on-error: true
        env:
          VIDEO_LANG: ja
        run: python scripts/make_video.py

      - name: Commit and push results
        run: |
          git config user.name "satire-desk-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git add -A videos || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "rebuild: videos for $(date -u +%Y-%m-%d)"
            git push
          fi
